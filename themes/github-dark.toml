# GitHub Dark — Odin adaptation. See themes/README.md for palette credits.
# Built in: :theme github-dark. Copy under a new name to customize.
background = "#0d1117"
foreground = "#e6edf3"
muted = "#8b949e"
accent = "#58a6ff"
secondary = "#d2a8ff"
warning = "#e3b341"
border = "#30363d"
selection = "#163356"
# ANSI 0–7, then bright 8–15. Explicit truecolor and indices 16–255 stay unchanged.
ansi = [
  "#0d1117", "#ff7b72", "#3fb950", "#d29922", "#58a6ff", "#bc8cff", "#39c5cf", "#b1bac4",
  "#6e7681", "#ffa198", "#56d364", "#e3b341", "#79c0ff", "#d2a8ff", "#56d4dd", "#f0f6fc",
]

[syntax_colors]
comment = "#8b949e"
keyword = "#ff7b72"
function = "#d2a8ff"
type = "#ffa657"
string = "#a5d6ff"
number = "#79c0ff"
constant = "#79c0ff"
operator = "#ff7b72"
variable = "#e6edf3"

