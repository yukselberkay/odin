[package]
name = "odin-editor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A lean, modal terminal workspace for builders"
license = "MIT"
default-run = "odin"

[[bin]]
name = "odin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
directories = "6"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.29"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "2", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
toml = "0.8"
unicode-width = "0.2"
vt100 = "0.15"

[dev-dependencies]
tempfile = "3"

# vt100 0.15 computes `rows - scrollback_offset` when the scrollback offset exceeds
# the screen height; the wrapped result is what it relies on, as in release builds.
[profile.dev.package.vt100]
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
