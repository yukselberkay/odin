# Monokai — Odin adaptation. See themes/README.md for palette credits.
# Built in: :theme monokai. Copy under a new name to customize.
background = "#272822"
foreground = "#f8f8f2"
muted = "#a6a28c"
accent = "#a6e22e"
secondary = "#66d9ef"
warning = "#e6db74"
border = "#555648"
